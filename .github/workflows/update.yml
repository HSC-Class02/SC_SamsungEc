name: Monthly DART Data Update & Dashboard Deploy

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 자동 실행
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DART Crawler & Analyzer
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python src/crawler.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update financial data and dashboard [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
