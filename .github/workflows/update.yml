name: DART financial data update

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dart-dashboard
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Collect DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/collect.py

      - name: Calculate metrics
        run: python src/metrics.py

      - name: Build dashboard data
        run: python src/build_site.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: refresh DART financial data"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
